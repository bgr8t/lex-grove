<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  
  <!-- Performance & Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://firebase.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  
  <!-- Viewport and responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  
  <!-- Primary Meta Tags -->
  <title>Lex Grove | Intelligent Legal Research Platform</title>
  <meta name="title" content="Lex Grove | Intelligent Legal Research Platform" />
  <meta name="description" content="Join collaborative legal research and access a modern, AI-powered legal knowledge platform. Find case briefs, legal analysis, and research tools." />
  <meta name="keywords" content="legal research, case briefs, legal analysis, AI legal platform, law research tools" />
  <meta name="author" content="Lex Grove" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lex Grove | Intelligent Legal Research Platform" />
  <meta property="og:description" content="Join collaborative legal research and access a modern, AI-powered legal knowledge platform." />
  <meta property="og:url" content="https://www.lexgrove.com" />
  <meta property="og:site_name" content="Lex Grove" />
  <meta property="og:image" content="/images/social_media_preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Lex Grove - Intelligent Legal Research" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lex Grove | Intelligent Legal Research Platform" />
  <meta name="twitter:description" content="Join collaborative legal research and access a modern, AI-powered legal knowledge platform." />
  <meta name="twitter:image" content="/images/social_media_preview.jpg" />
  <meta name="twitter:image:alt" content="Lex Grove - Intelligent Legal Research" />
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon1.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon1.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon1.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon1.ico" />
  <link rel="manifest" href="/favicon1.ico" />
  
  <!-- Theme & App -->
  <meta name="theme-color" content="#2563eb" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lex Grove" />
  
  <!-- Performance optimizations -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="format-detection" content="telephone=no" />
  
  <!-- Fonts with display swap for better performance -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </noscript>
  
  <!-- Critical CSS inline - prevents FOUC -->
  <style>
    /* Critical loading styles */
    * {
      box-sizing: border-box;
    }
    
    html {
      line-height: 1.15;
      -webkit-text-size-adjust: 100%;
    }
    
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #ffffff;
      color: #1f2937;
    }
    
    /* Initial loading screen */
    #root {
      min-height: 100vh;
    }
    
    .loading-fallback {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Hide loading fallback when React loads */
    .react-loaded .loading-fallback {
      display: none;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      
      .loading-fallback {
        background-color: #0f172a;
      }
      
      .loading-spinner {
        border-color: #475569;
        border-top-color: #3b82f6;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h1>JavaScript Required</h1>
      <p>You need to enable JavaScript to run this application.</p>
    </div>
  </noscript>
  
  <!-- Loading fallback while React loads -->
  <div class="loading-fallback" id="loading-fallback">
    <div class="loading-spinner"></div>
  </div>
  
  <!-- React app root -->
  <div id="root"></div>
  
  <!-- Service worker registration -->
  <script>
    // Remove loading fallback when React loads
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.addedNodes.length > 0) {
          document.body.classList.add('react-loaded');
          observer.disconnect();
        }
      });
    });
    
    const rootElement = document.getElementById('root');
    if (rootElement) {
      observer.observe(rootElement, { childList: true, subtree: true });
    }
    
    // Register service worker for caching
    if ('serviceWorker' in navigator && 'production' === 'production') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
    
    // Performance monitoring script
    window.addEventListener('load', () => {
      // Hide loading fallback after a maximum time
      setTimeout(() => {
        const fallback = document.getElementById('loading-fallback');
        if (fallback) {
          fallback.style.display = 'none';
        }
      }, 5000);
    });
  </script>
</body>
</html>
